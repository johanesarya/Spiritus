<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Motivasi Harian — Cute Mode</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Animasi fade */
    .msg {
      opacity: 0;
      transform: translateY(6px);
      transition: all .5s ease;
      position: absolute;
      left: 0; right: 0;
    }
    .msg.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body class="bg-gradient-to-b from-blue-100 to-pink-100 min-h-screen flex items-center justify-center p-4">

  <!-- MOBILE FRAME -->
  <div class="w-[390px] h-[780px] max-w-full rounded-3xl shadow-2xl overflow-hidden bg-white/40 backdrop-blur-lg border border-white/40 flex flex-col">

    <!-- HEADER -->
    <header class="flex items-center gap-3 px-5 py-4">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
        MH
      </div>
      <div>
        <div class="font-semibold text-gray-800 text-base">Motivasi Harian</div>
        <div class="text-xs text-gray-500">Cute, pastel, dan adem</div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 px-5 flex flex-col gap-4 justify-center">

      <!-- Card Motivasi -->
      <div class="relative bg-white/70 backdrop-blur-md border border-white/60 rounded-2xl p-5 shadow-lg min-h-[130px]">
        <div id="greeting" class="text-lg font-bold text-blue-700 mb-2">Halo!</div>
        <div class="text-gray-700 relative min-h-[60px]">
          <div id="messages-wrapper" class="relative w-full"></div>
        </div>
      </div>

      <!-- Card Tip -->
      <div class="bg-white/70 backdrop-blur-md border border-white/60 rounded-2xl p-3 text-center shadow-md">
        <small class="text-gray-500">Tip: Tutup & buka lagi untuk melihat pesan baru.</small>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center text-gray-500 text-xs py-3 border-t border-white/40 backdrop-blur-md">
      &copy; <span id="year"></span> Motivasi Cute
    </footer>

    <!-- MODAL -->
    <div id="modal" class="absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center px-5">
      <div class="w-full max-w-xs bg-white/90 rounded-xl shadow-xl p-5 border border-white/60">

        <h3 class="text-gray-800 font-semibold text-base mb-1">Hai! Siapa namamu?</h3>
        <p class="text-gray-500 text-sm mb-3">Masukkan nama agar kami bisa menyapamu dengan hangat.</p>

        <div class="flex gap-2 mb-2">
          <input id="nameInput" type="text"
                 class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300 outline-none"
                 placeholder="Nama kamu..." autocomplete="name">
          <button id="startBtn"
                  class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm font-semibold hover:bg-blue-600">
            Masuk
          </button>
        </div>

        <button id="skipBtn"
                class="mt-2 w-full py-2 border border-blue-300 text-blue-600 rounded-lg text-sm font-semibold hover:bg-blue-50">
          Lewati
        </button>

      </div>
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    const messages = [
      "Kamu hebat, bahkan saat kamu merasa tidak!",
      "Sedikit demi sedikit, lama-lama menjadi bukit.",
      "Istirahat juga produktivitas, lho.",
      "Hari ini adalah kesempatan baru!",
      "Kamu cukup. Kamu berharga.",
      "Teruslah melangkah, meski kecil.",
      "Senyummu bisa mengubah harimu!",
    ];

    const wrapper = document.getElementById('messages-wrapper');
    const greetingEl = document.getElementById('greeting');
    const modal = document.getElementById('modal');
    const nameInput = document.getElementById('nameInput');
    const startBtn = document.getElementById('startBtn');
    const skipBtn = document.getElementById('skipBtn');
    const yearEl = document.getElementById('year');

    yearEl.textContent = new Date().getFullYear();

    function showModal(show = true) {
      modal.style.display = show ? 'flex' : 'none';
      if (show) nameInput.focus();
    }

    const storedName = localStorage.getItem('cute_name');
    if (storedName) {
      applyName(storedName);
      showModal(false);
    } else {
      showModal(true);
    }

    function applyName(name) {
      greetingEl.textContent = name ? `Halo, ${name}!` : 'Halo!';
    }

    function pickRandomIndex(exclude) {
      let idx;
      do {
        idx = Math.floor(Math.random() * messages.length);
      } while (idx === exclude && messages.length > 1);
      return idx;
    }

    let currentIdx = -1;
    function showNextMessage() {
      const next = pickRandomIndex(currentIdx);
      currentIdx = next;

      const el = document.createElement('div');
      el.className = 'msg';
      el.textContent = messages[next];
      wrapper.appendChild(el);

      requestAnimationFrame(() => el.classList.add('show'));

      const others = wrapper.querySelectorAll('.msg');
      if (others.length > 2) wrapper.removeChild(others[0]);

      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 500);
      }, 4000);
    }

    showNextMessage();
    setInterval(showNextMessage, 4500);

    startBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (name) {
        localStorage.setItem('cute_name', name);
        applyName(name);
        showModal(false);
      } else {
        nameInput.placeholder = "Nama tidak boleh kosong...";
      }
    });

    skipBtn.addEventListener('click', () => showModal(false));
